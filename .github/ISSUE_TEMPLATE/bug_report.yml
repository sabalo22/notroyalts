name: Bug report
description: Report a reproducible NotRoyalTs problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please sanitize hostnames, usernames, IP addresses, and private infrastructure details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Connect...
        3. Run...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: input
    id: shell
    attributes:
      label: Remote shell and TERM
      placeholder: "bash, xterm-256color"
  - type: dropdown
    id: terminal
    attributes:
      label: Does the same issue happen in macOS Terminal?
      options:
        - "No"
        - "Yes"
        - "Not tested"
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
