name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app.py db.py app_lock.py
      - name: Import check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import app; print(app.APP_NAME, app.APP_VERSION)"
      - name: App Lock tests
        run: python -m unittest discover -s tests
